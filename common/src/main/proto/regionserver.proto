syntax = "proto3";

package minisql;

option java_package = "com.minisql.common.proto";
option java_outer_classname = "RegionServerProto";

import "common.proto";

// RegionServer 服务定义
service RegionServerService {
    // 数据操作
    rpc Put(PutRequest) returns (PutResponse);
    rpc Get(GetRequest) returns (GetResponse);
    rpc Scan(ScanRequest) returns (stream ScanResponse);
    rpc Delete(DeleteRequest) returns (DeleteResponse);
    rpc BatchPut(BatchPutRequest) returns (BatchPutResponse);

    // SQL 查询
    rpc ExecuteUpdate(ExecuteUpdateRequest) returns (ExecuteUpdateResponse);

    // Region 管理
    rpc OpenRegion(OpenRegionRequest) returns (OpenRegionResponse);
    rpc CloseRegion(CloseRegionRequest) returns (CloseRegionResponse);
    rpc SplitRegion(SplitRegionRequest) returns (SplitRegionResponse);
    rpc CommitSplit(CommitSplitRequest) returns (CommitSplitResponse);
    rpc AbortSplit(AbortSplitRequest) returns (AbortSplitResponse);
    rpc MergeRegion(MergeRegionRequest) returns (MergeRegionResponse);
    rpc CompactRegion(CompactRegionRequest) returns (CompactRegionResponse);
    rpc FlushRegion(FlushRegionRequest) returns (FlushRegionResponse);
    rpc GetSplitKey(GetSplitKeyRequest) returns (GetSplitKeyResponse);
    rpc CheckMergeCandidates(CheckMergeCandidatesRequest) returns (CheckMergeCandidatesResponse);

    // 副本同步
    rpc Replicate(ReplicateRequest) returns (ReplicateResponse);
    rpc GetReplicationLag(GetReplicationLagRequest) returns (GetReplicationLagResponse);
    rpc StreamSnapshot(stream StreamSnapshotRequest) returns (StreamSnapshotResponse);

    // Region migration
    rpc StartMigration(MigrateRequest) returns (MigrateResponse);
    rpc FinalizeMigration(FinalizeMigrationRequest) returns (FinalizeMigrationResponse);
    rpc AbortMigration(AbortMigrationRequest) returns (AbortMigrationResponse);
    rpc PromoteToPrimary(PromoteRequest) returns (PromoteResponse);
    rpc GetSnapshot(SnapshotRequest) returns (stream SnapshotResponse);
}

// 迁移请求
message MigrateRequest {
    string regionId = 1;
    ServerId targetServer = 2;
}

message MigrateResponse {
    Status status = 1;
    int64 sourceSequenceId = 2;
}

message FinalizeMigrationRequest {
    string regionId = 1;
    ServerId targetServer = 2;
    int64 fromSequenceId = 3;
}

message FinalizeMigrationResponse {
    Status status = 1;
    int64 sourceSequenceId = 2;
}

message AbortMigrationRequest {
    string regionId = 1;
}

message AbortMigrationResponse {
    Status status = 1;
}

// 提升为主副本请求
message PromoteRequest {
    string regionId = 1;
    int64 fencingToken = 2;  // Fencing token 防止脑裂
}

message PromoteResponse {
    Status status = 1;
    int64 fencingToken = 2;  // 返回确认的 fencing token
}

// 快照请求
message SnapshotRequest {
    string regionId = 1;
}

message SnapshotResponse {
    Status status = 1;
    repeated KeyValue keyValues = 2;
}

// Put 请求
message PutRequest {
    string regionId = 1;
    bytes rowKey = 2;
    repeated KeyValue keyValues = 3;
    bool durable = 4;  // 是否写入WAL
}

message PutResponse {
    Status status = 1;
}

// BatchPut 请求
message BatchPutRequest {
    string regionId = 1;
    repeated RowMutation mutations = 2;
    bool durable = 3;
}

message RowMutation {
    bytes rowKey = 1;
    repeated KeyValue keyValues = 2;
}

message BatchPutResponse {
    Status status = 1;
    repeated FailedMutation failures = 2;
}

message FailedMutation {
    bytes rowKey = 1;
    string errorMessage = 2;
}

// Get 请求
message GetRequest {
    string regionId = 1;
    bytes rowKey = 2;
    repeated string columnFamilies = 3;
    repeated string qualifiers = 4;
    int64 timestamp = 5;  // 获取指定时间戳的数据
}

message GetResponse {
    Status status = 1;
    repeated KeyValue keyValues = 2;
}

// Scan 请求
message OrderByElement {
    string column = 1;
    bool ascending = 2;
}

message ScanRequest {
    string regionId = 1;
    bytes startKey = 2;
    bytes endKey = 3;
    repeated string columnFamilies = 4;
    repeated string qualifiers = 5;
    int64 timestamp = 6;
    int32 limit = 7;  // 限制返回数量
    bool reversed = 8;  // 反向扫描
    string tableName = 9;  // Optional logical table name for predicate pushdown
    string whereClause = 10;  // Optional raw WHERE clause
    repeated OrderByElement orderBy = 11;  // ORDER BY pushdown
    int32 offset = 12;  // OFFSET pushdown
    repeated AggregateSpec aggregates = 13;  // Aggregate pushdown
    repeated string groupByColumns = 14;  // GROUP BY pushdown
}

message AggregateSpec {
    string function = 1;
    string column = 2;
    string outputName = 3;
}

message AggregateGroup {
    repeated bytes groupByKey = 1;
    repeated AggregateResult results = 2;
}

message AggregateResult {
    string outputName = 1;
    string function = 2;
    double sumValue = 3;
    int64 countValue = 4;
    bytes maxValue = 5;
    bytes minValue = 6;
}

message ScanResponse {
    Status status = 1;
    repeated KeyValue keyValues = 2;
    bool hasMore = 3;  // 是否还有更多数据
    repeated AggregateGroup aggregateGroups = 4;  // Aggregate results
}

// Delete 请求
message DeleteRequest {
    string regionId = 1;
    bytes rowKey = 2;
    repeated string columnFamilies = 3;
    repeated string qualifiers = 4;
    int64 timestamp = 5;  // 删除指定时间戳之前的数据
    bool deleteAllVersions = 6;
}

message DeleteResponse {
    Status status = 1;
}

// OpenRegion 请求
message OpenRegionRequest {
    RegionInfo region = 1;
    // 用于简化调用的字段
    string regionId = 2;
    string tableName = 3;
    bytes startKey = 4;
    bytes endKey = 5;
    bool asReplica = 6;  // 是否作为副本打开
}

message OpenRegionResponse {
    Status status = 1;
}

// CloseRegion 请求
message CloseRegionRequest {
    string regionId = 1;
    bool abort = 2;  // 是否强制关闭
    bool dropTable = 3;  // 是否删除 MySQL 表（用于 DROP TABLE 操作）
}

message CloseRegionResponse {
    Status status = 1;
}

// SplitRegion 请求
message SplitRegionRequest {
    string regionId = 1;
    bytes splitKey = 2;  // 分裂点，如果为空则由系统自动选择
    string leftRegionId = 3;   // 左孩子名字，Master 分配传入
    string rightRegionId = 4;  // 右孩子名字，Master 分配传入
}

message SplitRegionResponse {
    Status status = 1;
    RegionInfo leftRegion = 2;
    RegionInfo rightRegion = 3;
}

message CommitSplitRequest {
    string parentRegionId = 1;
    string leftRegionId = 2;
    string rightRegionId = 3;
}

message CommitSplitResponse {
    Status status = 1;
}

message AbortSplitRequest {
    string parentRegionId = 1;
    string leftRegionId = 2;
    string rightRegionId = 3;
}

message AbortSplitResponse {
    Status status = 1;
}

// GetSplitKey 请求 - 获取最佳分裂点
message GetSplitKeyRequest {
    string regionId = 1;
}

message GetSplitKeyResponse {
    Status status = 1;
    bytes splitKey = 2;  // 推荐的分裂点
}

// CompactRegion 请求
message CompactRegionRequest {
    string regionId = 1;
    bool major = 2;  // 是否主压缩
}

message CompactRegionResponse {
    Status status = 1;
}

// FlushRegion 请求
message FlushRegionRequest {
    string regionId = 1;
}

message FlushRegionResponse {
    Status status = 1;
}

// 副本同步
message ReplicateRequest {
    string regionId = 1;
    repeated LogEntry entries = 2;
}

message LogEntry {
    int64 sequenceId = 1;
    int64 timestamp = 2;
    repeated KeyValue mutations = 3;
    uint64 checksum = 4;  // CRC32 of serialized mutations for data integrity
}

message ReplicateResponse {
    Status status = 1;
    int64 lastAppliedSeqId = 2;
}

message GetReplicationLagRequest {
    string regionId = 1;
}

message GetReplicationLagResponse {
    Status status = 1;
    int64 lagInEntries = 2;
    int64 lagInBytes = 3;
    int64 currentSequenceId = 4;
    int64 lastAppliedSequenceId = 5;
}

// 流式快照推送
message StreamSnapshotRequest {
    string regionId = 1;
    repeated KeyValue batch = 2;
    bool isFinal = 3;
    int64 finalSequenceId = 4;
}

message StreamSnapshotResponse {
    Status status = 1;
    int64 lastAppliedSeqId = 2;
    int64 totalApplied = 3;
}

// ==================== Region 合并消息 ====================

// 合并 Region 请求
message MergeRegionRequest {
    string leftRegionId = 1;   // 左 Region（范围较小）
    string rightRegionId = 2;  // 右 Region（范围较大）
    string mergedRegionId = 3; // 合并后名字，Master 分配传入
}

message MergeRegionResponse {
    Status status = 1;
    RegionInfo mergedRegion = 2;  // 合并后的新 Region
    int64 totalEntries = 3;       // 合并的总条目数
}

// 检查可合并 Region 请求（Master 用）
message CheckMergeCandidatesRequest {
    string tableName = 1;  // 指定表名，为空则检查所有表
}

message CheckMergeCandidatesResponse {
    Status status = 1;
    repeated MergeCandidate candidates = 2;  // 可合并的 Region 对列表
    message MergeCandidate {
        string leftRegionId = 1;
        string rightRegionId = 2;
        int64 combinedSize = 3;  // 合并后的大小估计
    }
}

// ==================== SQL interfaces ====================

// ExecuteUpdate request
message ExecuteUpdateRequest {
    string regionId = 1;
    string sql = 2;
}

// ExecuteUpdate response
message ExecuteUpdateResponse {
    Status status = 1;
    int64 affectedRows = 2;
}
