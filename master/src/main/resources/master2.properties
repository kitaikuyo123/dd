# Master 配置文件
master.host=localhost
master.port=16001

# ZooKeeper 配置
zookeeper.connect=localhost:2181
zookeeper.session.timeout=10000
zookeeper.connection.timeout=10000

# 副本配置
replication.factor=2

# 负载均衡配置
load.balance.enabled=true
load.balance.interval.ms=10000
load.balance.strategy=load_based
load.balance.threshold=5
load.balance.min.migration.interval.ms=10000

# 每轮最大并发迁移数（防止惊群效应）
load.balance.max.migrations.per.round=3

# 热点感知放置策略
load.balance.hotspot.penalty.weight=15.0

# 热点检测配置
hotspot.detector.interval.ms=10000
hotspot.read.threshold.per.interval=100
hotspot.write.threshold.per.interval=200
hotspot.growth.threshold=1.2
hotspot.target.read.replica.count=3
hotspot.cooldown.ms=10000
region.split.table.cooldown.ms=10000

# 故障转移配置
failover.thread.pool.size=3
failover.max.retries=5
failover.cooldown.base.ms=5000
failover.cooldown.max.ms=120000
failover.candidate.lag.timeout.ms=10000

# Region 分裂/合并配置
region.split.threshold.mb=10240
region.merge.threshold.mb=100
region.merge.max.size.gb=8
region.merge.min.size.mb=10
region.merge.cooldown.ms=3600000
