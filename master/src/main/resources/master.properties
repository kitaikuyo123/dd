# Master 配置文件
master.host=localhost
master.port=16000

# ZooKeeper 配置
zookeeper.connect=localhost:2181
zookeeper.session.timeout=30000
zookeeper.connection.timeout=10000

# 心跳配置
heartbeat.interval.ms=3000
heartbeat.timeout.ms=90000

# 副本配置
replication.factor=3

# 负载均衡配置
load.balance.enabled=true
load.balance.interval.ms=300000
load.balance.strategy=load_based
load.balance.threshold=20
load.balance.min.migration.interval.ms=300000
load.balance.request.max.target.qps=5000

# 热点检测配置
hotspot.detector.interval.ms=10000
hotspot.read.threshold.per.interval=200
hotspot.write.threshold.per.interval=100
hotspot.growth.threshold=1.2
hotspot.target.read.replica.count=3
hotspot.cooldown.ms=300000

# Region 分裂/合并配置
region.split.threshold.mb=10240
region.merge.threshold.mb=100
region.merge.max.size.gb=8
region.merge.min.size.mb=10
region.merge.cooldown.ms=3600000

# 日志配置
log.level=INFO
log.file=./logs/master.log
