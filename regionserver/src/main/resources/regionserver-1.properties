# RegionServer 1 配置
regionserver.host=localhost
regionserver.port=16020

# 存储引擎选择：mysql 或 rocksdb
storage.type=mysql

# RocksDB 配置（storage.type=rocksdb 时生效）
# rocksdb.data.dir=./data/rocksdb
# rocksdb.write.buffer.size.mb=64
# rocksdb.compression=snappy

# 容量与分裂配置
regionserver.disk.capacity.mb=1024
regionserver.region.split.threshold.mb=256
regionserver.region.split.min.mb=64

# Master 地址
master.address=localhost:16000

# ZooKeeper 配置
zookeeper.connect=localhost:2181
zookeeper.session.timeout=30000

# MySQL 配置 - 连接到数据库 1
mysql.host=localhost
mysql.port=3306
mysql.database=minisql_db1
mysql.username=root
mysql.password=1qaz2wsx
mysql.max.connections=10

# 心跳配置
heartbeat.interval.ms=5000

# 副本配置
replication.factor=3

# 日志配置
log.level=INFO
log.file=./logs/regionserver1.log
