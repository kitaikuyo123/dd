# RegionServer 3 配置
regionserver.host=localhost
regionserver.port=16022

# RocksDB 配置
rocksdb.data.dir=./data/rocksdb3
rocksdb.write.buffer.size.mb=64
rocksdb.compression=snappy

# 容量与分裂配置
regionserver.disk.capacity.mb=1024
regionserver.region.split.threshold.mb=256
regionserver.region.split.min.mb=64

# Master 地址
master.address=localhost:16000

# ZooKeeper 配置
zookeeper.connect=localhost:2181
zookeeper.session.timeout=10000

# 心跳配置
heartbeat.interval.ms=5000

# 副本配置
replication.factor=3

# 日志配置
log.level=INFO
log.file=./logs/regionserver3.log
